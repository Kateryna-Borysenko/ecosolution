<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Ecosolution | Renewable energy for any task</title>
	</head>
	<body>
		<div class="container">
			<header class="header">
				<a
					href="/"
					class="logo header__logo-box"
				>
					<img
						src="./src/img/svg/logo.svg"
						alt="Ecosolution logo"
						class="logo__img"
					/>
				</a>
				<div class="navigation header__navigation">
					<input
						type="checkbox"
						class="navigation__checkbox"
						id="navi-toggle"
					/>

					<label
						for="navi-toggle"
						class="navigation__button"
					>
						<span class="navigation__icon">&nbsp;</span>
					</label>

					<div class="navigation__background">&nbsp;</div>

					<nav class="navigation__nav">
						<ul class="navigation__list">
							<li class="navigation__item">
								<a
									href="#section-main"
									class="navigation__link"
									>Main</a
								>
							</li>
							<li class="navigation__item">
								<a
									href="#section-about"
									class="navigation__link"
									>About</a
								>
							</li>
							<li class="navigation__item">
								<a
									href="#section-cases"
									class="navigation__link"
									>Cases</a
								>
							</li>
							<li class="navigation__item">
								<a
									href="#section-FAQ"
									class="navigation__link"
									>FAQ</a
								>
							</li>
							<li class="navigation__item">
								<a
									href="#section-contact"
									class="navigation__link"
									>Contact Us</a
								>
							</li>
						</ul>
					</nav>
				</div>
			</header>
		</div>

		<script
			type="module"
			src="/src/js/main.js"
		></script>
	</body>
</html>
